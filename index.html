<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Pessoal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Blog Pessoal</h1>
        <button id="btn-abrir-modal">Novo Post</button>
    </header>

    <main id="grid-posts"></main>

    <div id="modal-post" class="modal escondida">
        <div class="conteudo-modal">
            <h2>Nova Publicação</h2>
            <form id="form-novo-post">
                <input type="text" id="novo-titulo" placeholder="Título" required>
                <textarea id="novo-conteudo" placeholder="Conteúdo" rows="3" required></textarea>
                <input type="file" id="nova-imagem" accept="image/*" required>
                
                <div class="botoes">
                    <button type="button" id="btn-fechar-modal">Cancelar</button>
                    <button type="submit">Publicar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
